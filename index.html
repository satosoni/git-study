<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日の過ごし方提案アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>今の気分はどれ？ 🤔</h1>
        <p class="subtitle">あなたの今の気分に合わせて、おすすめの過ごし方を提案します</p>
        
        <div class="button-container">
            <button class="mood-btn" onclick="recommend('relax')">🍵 まったりリラックス</button>
            <button class="mood-btn" onclick="recommend('active')">🔥 やる気MAX！</button>
            <button class="mood-btn" onclick="recommend('lazy')">🛌 もう何もしたくない</button>
            <button class="mood-btn" onclick="recommend('refresh')">🍃 気持ちリフレッシュ</button>
        </div>

        <div id="result-card" class="result-card hidden">
            <h2>おすすめの過ごし方 ✨</h2>
            <p id="result-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
